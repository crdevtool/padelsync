# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen
#   ./gradlew :core:assemblePadelSyncCoreDebugXCFramework   (from the repo root)
#   xcodegen generate --spec apple/project.yml
name: PadelSync

options:
  bundleIdPrefix: com.padelsync
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "NO"
    # The shared core is built for Apple-silicon simulators only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    "EXCLUDED_ARCHS[sdk=watchsimulator*]": x86_64

targets:
  PadelSync:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    dependencies:
      - framework: ../core/build/XCFrameworks/debug/PadelSyncCore.xcframework
        embed: false
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: PadelSync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: PadelSync uses Bluetooth to share the score with the other players' phones and watches on your court.
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padelsync.app
        TARGETED_DEVICE_FAMILY: "1"

  PadelSyncWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: watchOS
    dependencies:
      - framework: ../core/build/XCFrameworks/debug/PadelSyncCore.xcframework
        embed: false
    info:
      path: watchOS/Info.plist
      properties:
        CFBundleDisplayName: PadelSync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.padelsync.app
        # The watch app works on its own: it joins a court directly over
        # Bluetooth and does not need the iPhone app to be installed.
        WKRunsIndependentlyOfCompanionApp: true
        NSBluetoothAlwaysUsageDescription: PadelSync uses Bluetooth to share the score with the other players' phones and watches on your court.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padelsync.app.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  PadelSync:
    build:
      targets:
        PadelSync: all
  PadelSyncWatch:
    build:
      targets:
        PadelSyncWatch: all
