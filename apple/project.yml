# XcodeGen spec. Generate the Xcode project with (from the repo root):
#   brew install xcodegen
#   ./gradlew :core:assemblePadelSyncCoreDebugXCFramework
#   apple/use-core.sh debug
#   xcodegen generate --spec apple/project.yml
#
# The apps link the shared core from apple/Frameworks, which use-core.sh
# fills with either the debug or the release build of it.
name: PadelSync

options:
  bundleIdPrefix: com.crdevtool
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "NO"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # The shared core is built for Apple-silicon simulators only. These two
    # lines apply to simulator builds alone; builds for real devices are not
    # touched by them.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    "EXCLUDED_ARCHS[sdk=watchsimulator*]": x86_64

targets:
  PadelSync:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    dependencies:
      - framework: Frameworks/PadelSyncCore.xcframework
        embed: false
      # Apple delivers a watch app inside its iPhone app: the watch app is
      # built with the iPhone app and copied into it, under Watch/.
      - target: PadelSyncWatch
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: PadelSync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: PadelSync uses Bluetooth to share the score with the other players' phones and watches on your court.
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        LSRequiresIPhoneOS: true
        # The app has no encryption of its own, so each upload needs no
        # export-compliance answer.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crdevtool.padelsync
        TARGETED_DEVICE_FAMILY: "1"

  # Drives the iPhone app through a full match on a simulator and saves
  # screenshots. Run by the build server; see .github/scripts/build-apple.sh.
  PadelSyncUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iOSUITests
    dependencies:
      - target: PadelSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crdevtool.padelsync.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: PadelSync

  PadelSyncWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: watchOS
    dependencies:
      - framework: Frameworks/PadelSyncCore.xcframework
        embed: false
    info:
      path: watchOS/Info.plist
      properties:
        CFBundleDisplayName: PadelSync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.crdevtool.padelsync
        # The watch app works on its own: it joins a court directly over
        # Bluetooth and does not need the iPhone app to be installed.
        WKRunsIndependentlyOfCompanionApp: true
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: PadelSync uses Bluetooth to share the score with the other players' phones and watches on your court.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crdevtool.padelsync.watchkitapp
        # The watch app is delivered inside the iPhone app, never as an app
        # of its own in an archive.
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  PadelSync:
    build:
      targets:
        PadelSync: all
    test:
      targets:
        - PadelSyncUITests
  PadelSyncWatch:
    build:
      targets:
        PadelSyncWatch: all
