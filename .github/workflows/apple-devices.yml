# Builds the iPhone and Apple Watch apps for real devices (unsigned), to
# prove that the shared core links for every Apple device architecture.
# Started by hand: Mac build minutes are expensive.
name: Apple device build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  devices:
    name: iPhone and Apple Watch, device architectures
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          set -o pipefail
          bash .github/scripts/build-apple-devices.sh 2>&1 | tee build.log
      - name: Publish log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-log.sh apple-devices build.log "${{ job.status }}"
