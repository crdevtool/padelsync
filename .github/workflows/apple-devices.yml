# A rehearsal of the App Store build that needs no Apple account: the
# release build of the shared core for device architectures, and the iPhone
# app with the watch app inside it as an unsigned archive, checked for what
# an upload needs. It runs on the same Mac and Xcode as the real release
# (release-apple.yml), so a release does not fail on something this would
# have caught. Started by hand: Mac build minutes are expensive.
name: Apple device build (release rehearsal)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  devices:
    name: iPhone and Apple Watch, release build for devices (unsigned)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          set -o pipefail
          bash .github/scripts/build-apple-devices.sh 2>&1 | tee build.log
      - name: Publish log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-log.sh apple-devices build.log "${{ job.status }}"
