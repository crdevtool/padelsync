name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  core:
    name: Shared core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: |
          set -o pipefail
          ./gradlew :core:jvmTest --stacktrace 2>&1 | tee build.log
      - name: Publish log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-log.sh core build.log "${{ job.status }}"

  android:
    name: Android and Wear OS apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs
        run: |
          set -o pipefail
          ./gradlew :mobile:assembleDebug :wear:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Publish test build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp mobile/build/outputs/apk/debug/mobile-debug.apk PadelSync-phone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk PadelSync-watch.apk
          notes="Test build from commit ${GITHUB_SHA:0:7}, $(date -u '+%Y-%m-%d %H:%M UTC'). PadelSync-phone.apk is for Android phones, PadelSync-watch.apk is for Wear OS watches."
          if gh release view test-build >/dev/null 2>&1; then
            gh release edit test-build --notes "$notes"
          else
            gh release create test-build --prerelease --title "Latest test build" --notes "$notes"
          fi
          gh release upload test-build PadelSync-phone.apk PadelSync-watch.apk --clobber
      - name: Keep APKs for the emulator tests
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: PadelSync-*.apk
          retention-days: 7
      - name: Publish log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-log.sh android build.log "${{ job.status }}"

  smoke:
    name: Emulator run (${{ matrix.device }})
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            api: 34
            target: default
            profile: pixel_5
          - device: watch
            api: 33
            target: android-wear
            profile: wearos_large_round
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apks
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/smoke-${{ matrix.device }}.sh 2>&1 | tee smoke.log
      - name: Publish screenshots and log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-log.sh smoke-${{ matrix.device }} smoke.log "${{ job.status }}" shots

  sync:
    name: Two-device sync (emulators)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apks
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Host on one emulator, join from another
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/smoke-sync.sh 2>&1 | tee smoke.log
      - name: Publish screenshots and log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-log.sh smoke-sync smoke.log "${{ job.status }}" shots

  # Mac build minutes are expensive, so this runs only when asked for: put
  # "[apple]" in the commit message, or start the workflow by hand.
  apple:
    name: iPhone and Apple Watch apps
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apple]')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          set -o pipefail
          bash .github/scripts/build-apple.sh 2>&1 | tee build.log
      - name: Publish log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-log.sh apple build.log "${{ job.status }}" shots
