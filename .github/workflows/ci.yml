name: CI

# Started by hand only. Private repositories get a limited number of free
# build minutes a month, and running everything on every push uses them up
# within a day or two. Start a run from the Actions tab ("Run workflow") and
# choose only what is needed:
#   - Emulators "none": shared tests and the Android APKs (about 10 minutes).
#   - Emulators "phone" or "watch": also runs that app through a solo match
#     on an emulator, with screenshots (stopped after 15 minutes each).
#   - Emulators "location": on an Android 11 phone emulator, checks that
#     "Join a court" explains itself while the phone's location is switched
#     off, and starts searching once it is on (stopped after 15 minutes).
#   - Emulators "sync-phone" or "sync-watch": a phone hosts and a second
#     emulator joins over virtual Bluetooth (stopped after 20 minutes each).
#   - Emulators "all": all five of the above.
#   - Apple: also builds and runs the iPhone and Apple Watch apps (about 15
#     minutes on a Mac, which GitHub counts ten times over).
# An emulator run stops at the first screen or button it cannot find, and the
# job fails; the screenshots and log up to that point are still published.
on:
  workflow_dispatch:
    inputs:
      emulators:
        description: Android emulator tests to run after the build
        type: choice
        options: [none, phone, watch, location, sync-phone, sync-watch, all]
        default: none
      apple:
        description: Also build the iPhone and Apple Watch apps (about 15 Mac minutes, counted 10x)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  core:
    name: Shared core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: |
          set -o pipefail
          ./gradlew :core:jvmTest --stacktrace 2>&1 | tee build.log
      - name: Publish log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-log.sh core build.log "${{ job.status }}"

  android:
    name: Android and Wear OS apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs
        run: |
          set -o pipefail
          ./gradlew :mobile:assembleDebug :wear:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Publish test build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp mobile/build/outputs/apk/debug/mobile-debug.apk PadelSync-phone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk PadelSync-watch.apk
          notes="Test build from commit ${GITHUB_SHA:0:7}, $(date -u '+%Y-%m-%d %H:%M UTC'). PadelSync-phone.apk is for Android phones, PadelSync-watch.apk is for Wear OS watches."
          if gh release view test-build >/dev/null 2>&1; then
            gh release edit test-build --notes "$notes"
          else
            gh release create test-build --prerelease --title "Latest test build" --notes "$notes"
          fi
          gh release upload test-build PadelSync-phone.apk PadelSync-watch.apk --clobber
      - name: Keep APKs for the emulator tests
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: PadelSync-*.apk
          retention-days: 7
      - name: Publish log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-log.sh android build.log "${{ job.status }}"

  smoke:
    name: Emulator run (${{ matrix.device }})
    if: contains(fromJSON('["phone", "watch", "location", "all"]'), inputs.emulators)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Built as whole entries: a fixed "include" list would add the other
        # device back in as an extra combination.
        include: >-
          ${{ fromJSON(inputs.emulators == 'all' && '[{"device": "phone", "api": 34, "target": "default", "profile": "pixel_5"}, {"device": "watch", "api": 33, "target": "android-wear", "profile": "wearos_large_round"}, {"device": "location", "api": 30, "target": "default", "profile": "pixel_5"}]' || inputs.emulators == 'watch' && '[{"device": "watch", "api": 33, "target": "android-wear", "profile": "wearos_large_round"}]' || inputs.emulators == 'location' && '[{"device": "location", "api": 30, "target": "default", "profile": "pixel_5"}]' || '[{"device": "phone", "api": 34, "target": "default", "profile": "pixel_5"}]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apks
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # One line, run by "sh -c". Without pipefail the step would report
          # tee's status, and a failed run would pass.
          script: bash -o pipefail -c 'bash .github/scripts/smoke-${{ matrix.device }}.sh 2>&1 | tee smoke.log'
      - name: Publish screenshots and log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-log.sh smoke-${{ matrix.device }} smoke.log "${{ job.status }}" shots

  sync:
    name: Phone hosts, ${{ matrix.guest }} joins (emulators)
    if: contains(fromJSON('["sync-phone", "sync-watch", "all"]'), inputs.emulators)
    needs: android
    runs-on: ubuntu-latest
    # Five minutes more than the single-emulator runs: this one also
    # downloads, starts and waits for a second emulator.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        guest: ${{ fromJSON(inputs.emulators == 'all' && '["phone", "watch"]' || inputs.emulators == 'sync-phone' && '["phone"]' || '["watch"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apks
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free disk space for a second emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
      - name: Host on one emulator, join from another
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # One line, run by "sh -c". Without pipefail the step would report
          # tee's status, and a failed run would pass.
          script: bash -o pipefail -c 'bash .github/scripts/smoke-sync.sh ${{ matrix.guest }} 2>&1 | tee smoke.log'
      - name: Publish screenshots and log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-log.sh sync-${{ matrix.guest }} smoke.log "${{ job.status }}" shots

  apple:
    name: iPhone and Apple Watch apps
    if: inputs.apple
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          bash .github/scripts/build-apple.sh 2>&1 | tee build.log
      - name: Publish log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-log.sh apple build.log "${{ job.status }}" shots
