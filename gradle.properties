org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
# The iOS and watchOS targets can only be built on macOS. On Windows and Linux
# they are skipped; this silences the warning about that.
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
# The version players see, for the Android phone app and the Wear OS app.
# Raise it here for a new version. Version codes are worked out from the
# release number; see buildSrc/src/main/kotlin/PlayRelease.kt.
padelsync.versionName=0.1.0
android.nonTransitiveRClass=true
